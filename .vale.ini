StylesPath = tools/vale
MinAlertLevel = warning
Packages = write-good, alex, proselint

[formats]
html = md

[*.html]
BasedOnStyles = luffy
write-good.Illusions = YES

[content/en/**/*.html]
BasedOnStyles = luffy, luffy-en, alex
proselint.RASSyndrome = YES
proselint.Oxymorons = YES
proselint.Spelling = YES
alex.Condescending = NO
alex.ProfanityLikely = NO
alex.ProfanityUnlikely = NO
alex.ProfanityMaybe = NO
alex.Ablist = NO
alex.Race = NO

[content/fr/**/*.html]
BasedOnStyles = luffy, luffy-fr
write-good.Illusions = NO
