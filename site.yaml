---
mode: development
deploy_root: '.out'
media_root: media
media_url: /media
base_url: /
encode_safe: "/@"
plugins:
  - hyde.ext.plugins.meta.MetaPlugin
  - hyde.ext.plugins.git.GitDatesPlugin
  - extensions.combine.CombinePlugin
  - hyde.ext.plugins.languages.LanguagePlugin
  - hyde.ext.plugins.auto_extend.AutoExtendPlugin
  - hyde.ext.plugins.sorter.SorterPlugin
  - hyde.ext.plugins.tagger.TaggerPlugin
  - extensions.python.PythonPlugin
  - hyde.ext.plugins.textlinks.TextlinksPlugin
  - extensions.css.PostCSSPlugin
  - extensions.svg.SVGFontsPlugin
  - extensions.images.ImageThumbnailsPlugin
  - extensions.images.ImageFixerPlugin
  - extensions.images.CoverImagePlugin
  - extensions.text.FootnotesPlugin
  - extensions.text.TOCPlugin
  - extensions.typo.TypographyPlugin
  - extensions.pygments.PygmentPlugin
  - extensions.load.LoadPlugin
  - extensions.js.EsbuildPlugin
  - extensions.markdown.glyphs.GlyphsPlugin
  - extensions.markdown.references.ReferenceCheckPlugin
  - hyde.ext.plugins.urls.UrlCleanerPlugin
  # Don't forget to copy new plugins in site-production.yaml
context:
  data:
    base: https://vincent.bernat.ch
    languages:
      en: English
      fr: français
meta:
  nodemeta: meta.yaml
  author: Vincent Bernat
  mastodon: "@vincent@bernat.ch"
  bluesky: "vincent.bernat.ch"
  github: vincentbernat
  title: "MTU Ninja | Vincent Bernat"
  language: en
  locale: en_US
  share: false
  popular: false
  featured: false
  tags: [unclassified]
  sources: https://github.com/vincentbernat/vincent.bernat.ch
simple_copy:
  - media/videos/**
  - media/files/**
load:
  - selector: ".lf-media-outer, .lf-gallery"
    files: js/luffy1.rhythm.js
  - selector: ".lf-sidenote"
    files:
      - css/luffy1.sidenotes.css
  - selector: ".toc"
    files:
      - js/luffy1.toc.js
      - css/luffy1.toc.css
  - selector: ".codehilite"
    files:
      - js/luffy1.code.js
      - css/luffy1.code.css
  - selector: ".lf-media"
    files: css/luffy1.media.css
  - selector: "video.lf-media source[type='application/vnd.apple.mpegurl']"
    files: js/hls.js
    lazy: true
  - selector: "video.lf-media source[type='application/vnd.apple.mpegurl']"
    files: js/luffy1.videos.js
  - selector: ".lf-gallery"
    files:
      - css/gallery.css
      - js/gallery.js
  - selector: ".lf-listing"
    files:
      - css/luffy1.listing.css
  - selector: x-latex
    files: css/katex.css
markdown:
  extensions:
    - codehilite
    - extra
    - toc
    - extensions.markdown.admonition
    - extensions.markdown.glyphs
    - extensions.markdown.katex
    - extensions.markdown.shortlinks
    - extensions.markdown.html_comments
    - extensions.markdown.responsive_table
    - extensions.markdown.codehilite_lang
    - extensions.markdown.no_shortcut_links
    - extensions.markdown.references
  extension_configs:
    toc:
      permalink: "#"
      # Also modify it in layout/atom.j2
    codehilite:
      guess_lang: false
    extra:
      footnotes:
        BACKLINK_TEXT: '&#x2766;'
  output_format: html
jinja2:
  filters:
    human_date: extensions.jinja.human_date
    same_tag: extensions.jinja.same_tag
    media_listing: extensions.jinja.media_listing
    mastodon_href: extensions.jinja.mastodon_href
    clean_rss: extensions.jinja.clean_rss
    markdown: extensions.jinja.markdown
    reading_time: extensions.jinja.reading_time
  functions:
    include_file: extensions.jinja.include_file
sorter:
  name:
    attr:
      - relative_path
  time:
    attr:
      - meta.created
    reverse: true
    filters:
      source.kind: html
      meta.listable: true
  uuid_fr:
    attr:
      - meta.uuid
    circular: true
    filters:
      source.kind: html
      meta.listable: true
      meta.language: fr
  uuid_en:
    attr:
      - meta.uuid
    circular: true
    filters:
      source.kind: html
      meta.listable: true
      meta.language: en
  time_fr:
    attr:
      - meta.created
      - relative_path
    reverse: true
    filters:
      source.kind: html
      meta.listable: true
      meta.language: fr
  time_en:
    attr:
      - meta.created
      - relative_path
    reverse: true
    filters:
      source.kind: html
      meta.listable: true
      meta.language: en
tagger:
  sorter: time
  tags:
    network:
      descr_en: network
      descr_fr: réseau
    network-bgp:
      descr: BGP
    network-automation:
      descr_en: automation
      descr_fr: automatisation
    network-monitoring:
      descr_en: monitoring
      descr_fr: supervision
    network-vxlan:
      descr: VXLAN
    network-tls:
      descr: TLS
    network-vpn:
      descr: VPN
    network-ipv6:
      descr: IPv6
    linux:  # this means "Linux kernel"
      descr: Linux
    programming:
      descr_en: programming
      descr_fr: programmation
    programming-go:
      descr: Go
    programming-c:
      descr: C
    programming-python:
      descr: Python
    programming-shell:
      descr: shell
    project:
      descr_en: project
      descr_fr: projet
      hidden: true
    project-akvorado:
      descr: Akvorado
    distribution:
      descr: distribution
    distribution-debian:
      descr: Debian
    distribution-nixos:
      descr: NixOS
    retro:
      descr_en: retrocomputing
      descr_fr: rétrocomputing
    retro-wguide:
      descr: W
    web:
      descr: web
    security:
      descr_en: security
      descr_fr: sécurité
    desktop:
      descr_en: desktop environment
      descr_fr: environnement de bureau
    talks:
      descr_en: talks
      descr_fr: présentations
    unclassified:
      descr_en: unclassified
      descr_fr: non classé
    outdated:
      descr_en: outdated
      descr_fr: périmé
urlcleaner:
  index_file_names:
    - index.html
  strip_extensions:
    - html
  append_slash: false
