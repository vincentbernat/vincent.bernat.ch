<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Typography harness</title>
    <style>
      @font-face {
        font-family: Literata;
        font-style: italic;
        src: url("fonts/literata-italic.woff2") format("woff2");
      }
      @font-face {
        font-family: Literata;
        font-style: normal;
        src: url("fonts/literata.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        background: #fff9f0;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        top: 0;
        left: 0;
        box-sizing: border-box;
        background: #fff9f0;
        color: #000;
      }
      #stage.calibrate {
        background: #ff00ff;
      }
      #stage.calibrate > * {
        visibility: hidden;
      }
      #label {
        font: 15px/1.4 sans-serif;
        color: #404040;
        white-space: nowrap;
      }
      #label b {
        color: #21519c;
      }
      #label .off {
        color: #b0b0b0;
        text-decoration: line-through;
      }
      #block {
        position: relative;
      }
      /* Right edge of the text block */
      #block::after {
        content: "";
        position: absolute;
        top: -6px;
        bottom: -6px;
        right: -1px;
        width: 1px;
        background: #b80f28;
        opacity: 0.5;
      }
      #text {
        margin: 0;
        font-family: Literata, serif;
        font-style: italic;
        font-size: 20px;
        line-height: 1.5;
        font-variant-numeric: oldstyle-nums;
        overflow-wrap: break-word;
        hyphens: manual;
      }
      #text.auto {
        hyphens: auto;
        hyphenate-limit-chars: auto 2 3;
        -webkit-hyphenate-limit-before: 2;
        -webkit-hyphenate-limit-after: 3;
      }
      #text.none {
        hyphens: none;
      }
      #text.justify {
        text-align: justify;
      }
      #text.pretty {
        text-wrap: pretty;
      }
    </style>
    <link rel="stylesheet" href="media/css/luffy1.debug.css" />
  </head>
  <body>
    <div id="stage">
      <div id="label"></div>
      <main class="lf-main" id="block"><p id="text"></p></main>
      <input type="checkbox" id="lf1-typo-harness" hidden />
    </div>
    <script>
      window.luffy = {};
    </script>
    <script src="media/js/luffy1.debug.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const BROWSER = params.get("browser") || "?";
      const VARIANT = params.get("text") || "raw";
      const HYPHENS = (params.get("hyphens") || "none,auto").split(",");
      const JUSTIFY = (params.get("justify") || "0,1").split(",").map(Number);
      const PRETTY = (params.get("pretty") || "0,1").split(",").map(Number);
      // Starting width for each hyphenation mode, where the last line is a
      // runt in every browser
      const WIDTHS = { none: 770, auto: 770, manual: 770 };
      for (const item of (params.get("width") || "").split(",").filter(Boolean)) {
        const [mode, width] = item.split(":");
        WIDTHS[mode] = Number(width);
      }
      const W = Math.max(...HYPHENS.map((h) => WIDTHS[h]));
      const GROW = Number(params.get("grow") || 0.1);
      const FPS = 30;
      const HOLD_START = 1; // seconds at the narrow width
      const SWEEP = 2; // seconds from the narrow to the wide width
      const HOLD_END = 0.5; // seconds at the wide width
      const SPACES = params.get("spaces") !== "0";
      const MEASURE = params.get("measure");
      const PAD = 24;
      const LABEL = 36;
      // Same height for every video: lines of 20px × 1.5
      const LINES = Number(params.get("lines") || 4);

      const stage = document.getElementById("stage");
      const label = document.getElementById("label");
      const block = document.getElementById("block");
      const text = document.getElementById("text");

      const combos = [];
      for (const pretty of PRETTY)
        for (const justify of JUSTIFY)
          for (const hyphens of HYPHENS) combos.push({ hyphens, justify, pretty });
      const perCombo = Math.round((HOLD_START + SWEEP + HOLD_END) * FPS);

      function widthAt(combo, i) {
        const t = i / FPS - HOLD_START;
        const x = Math.min(1, Math.max(0, t / SWEEP));
        const eased = x * x * (3 - 2 * x);
        return Math.round(WIDTHS[combo.hyphens] * (1 + GROW * eased));
      }

      function flag(name, on) {
        return on ? `<b>${name}</b>` : `<span class="off">${name}</span>`;
      }

      function apply(combo, width) {
        text.className = [
          combo.hyphens,
          combo.justify ? "justify" : "",
          combo.pretty ? "pretty" : "",
        ].join(" ");
        block.style.width = `${width}px`;
        // Only options changing in the video
        const parts = [BROWSER];
        if (HYPHENS.length > 1) parts.push(`<b>hyphens: ${combo.hyphens}</b>`);
        if (JUSTIFY.length > 1) parts.push(flag("text-align: justify", combo.justify));
        if (PRETTY.length > 1) parts.push(flag("text-wrap: pretty", combo.pretty));
        parts.push(`${width}px`);
        label.innerHTML = parts.join(" · ");
      }

      // luffy1.debug.js redraws its marks on change events of these inputs
      const redraw = () =>
        document.getElementById("lf1-typo-harness").dispatchEvent(new Event("change"));

      const frame = () =>
        new Promise((resolve) =>
          requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(resolve, 40))),
        );

      // Lines and last line for each width, to choose the starting width
      async function measure(content) {
        text.textContent = content;
        await document.fonts.load("italic 20px Literata");
        await document.fonts.ready;
        const [from, to] = MEASURE.split("-").map(Number);
        const rows = [];
        for (const hyphens of HYPHENS) {
          for (let width = from; width <= to; width += 5) {
            apply({ hyphens, justify: 0, pretty: 0 }, width);
            const range = document.createRange();
            range.selectNodeContents(text);
            const rects = [...range.getClientRects()].filter((r) => r.width > 0);
            const tops = new Set(rects.map((r) => Math.round(r.top)));
            const last = rects[rects.length - 1];
            // Characters on the last line, from the middle of their boxes
            const node = text.firstChild;
            const middles = [];
            for (let i = 0; i < node.length; i++) {
              range.setStart(node, i);
              range.setEnd(node, i + 1);
              const r = [...range.getClientRects()].find((r) => r.width > 0);
              middles.push(r ? (r.top + r.bottom) / 2 : null);
            }
            const lastMiddle = Math.max(...middles.filter((m) => m !== null));
            let first = node.length;
            while (first > 0 && (middles[first - 1] === null || middles[first - 1] > lastMiddle - 10))
              first--;
            const words = node.data.slice(first).trim();
            rows.push(`${hyphens} ${width}: ${tops.size} lines, last line "${words}"`);
          }
        }
        await fetch("log", { method: "POST", body: rows.join("\n") });
        await fetch("done");
      }

      async function main() {
        const texts = await (await fetch("texts.json")).json();
        if (MEASURE) return measure(texts[VARIANT]);
        text.textContent = texts[VARIANT];
        await document.fonts.load("italic 20px Literata");
        await document.fonts.ready;

        stage.style.padding = `${PAD}px`;
        const stageWidth = Math.ceil(W * (1 + GROW)) + 2 * PAD;
        const stageHeight = LINES * 30 + LABEL + 2 * PAD;
        stage.style.width = `${stageWidth + (stageWidth % 2)}px`;
        stage.style.height = `${stageHeight + (stageHeight % 2)}px`;
        label.style.height = `${LABEL}px`;
        for (const combo of combos) {
          apply(combo, WIDTHS[combo.hyphens]);
          const lines = Math.round(text.getBoundingClientRect().height / 30);
          if (lines > LINES) throw new Error(`${lines} lines, more than ${LINES}`);
        }

        stage.classList.add("calibrate");
        await frame();
        const size = stage.getBoundingClientRect();
        await fetch(`calibrate?w=${size.width}&h=${size.height}`);
        stage.classList.remove("calibrate");
        if (SPACES) luffy.debug.s();

        let n = 0;
        for (const combo of combos) {
          for (let i = 0; i < perCombo; i++) {
            apply(combo, widthAt(combo, i));
            if (SPACES) redraw();
            await frame();
            await fetch(`frame?n=${n++}`);
          }
        }
        await fetch("done");
      }
      main().catch((e) => fetch(`error?m=${encodeURIComponent(e.stack || e)}`));
    </script>
  </body>
</html>
