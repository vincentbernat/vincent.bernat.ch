cache = true
max_cache_age = "7d"

host_concurrency = 2
host_request_interval = "100ms"
timeout = 20

scheme = ["http", "https"]
accept = ["100..=103", "200..=299"]
exclude_loopback = true
exclude = [
  '^https://lobste\.rs/stories/new',
  '^https://news\.ycombinator\.com/submitlink',
  '^https://www\.linkedin\.com/sharing',
  '^https://www\.facebook\.com/sharer\.php',
  '^https://www\.reddit\.com/submit',
  '^https://twitter\.com/intent/tweet',
  '^https://bsky\.app/intent/compose',
  '^https://www\.threads\.com/intent/post',
  '^https://toot\.kytta\.dev',
  '^https://github\.com/vincentbernat/vincent\.bernat\.ch',
  '^https://web\.archive\.org/web/',
  '^https://vincent\.bernat\.ch/api/v0/hit',
  # The following sites have too many links and heavily rate limit us
  # '^https://sci-hub\.fr/',
  # '^https://oadoi\.org/',
  # '^https://vgmrips\.net/',
  # '^https://www\.rfc-editor\.org/rfc/',
]
