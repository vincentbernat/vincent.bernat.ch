[project]
name = "www"
version = "0.0.0"
description = "Vincent Bernat's website"
authors = [{ name = "Vincent Bernat", email = "vincent@bernat.ch" }]
requires-python = ">=3.14"
dependencies = [
    "Babel==2.*",
    "Jinja2==3.*",
    "Markdown==3.*",
    "Pillow",
    "Pygments==2.*",
    "PyYAML",
    "doit",
    "langcodes[data]==3.*",
    "lxml",
    "pyquery==2.*",
    "pygments-haproxy",
    "pygments-ios",
    "pygments-junos",
    "py-spy>=0.4.1",
    "skia-python>=144.0.post2",
    "matplotlib>=3.9.4",
    "pypdf>=6.17.0",
    "smartypants==2.*",
    "typogrify==2.*",
]

[tool.doit]
dodoFile = "ssg/dodo.py"
cwdPath = "."

[tool.uv]

[tool.uv.sources]
pygments = { git = "https://github.com/vincentbernat/pygments", branch = "feature/css-updates" }
pygments-haproxy = { git = "https://github.com/vincentbernat/pygments-haproxy", rev = "master" }
pygments-ios = { git = "https://github.com/vincentbernat/pygments-ios", rev = "master" }
pygments-junos = { git = "https://github.com/vincentbernat/pygments-junos", rev = "master" }

# The project is empty. We only use the dependencies.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
