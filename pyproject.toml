[project]
name = "www"
version = "0.0.0"
description = "Vincent Bernat's website"
authors = [{ name = "Vincent Bernat", email = "vincent@bernat.ch" }]
requires-python = ">=3.14"
dependencies = [
    "Babel==2.*",
    "Jinja2==3.*",
    "Markdown==3.*",
    "Pillow",
    "Pygments==2.*",
    "PyYAML",
    "doit",
    "langcodes[data]==3.*",
    "lxml[cssselect]",
    "pygments-haproxy",
    "pygments-ios",
    "pygments-junos",
    "skia-python>=144.0.post2",
    "matplotlib>=3.9.4",
    "types-Markdown",
    "types-lxml",
    "types-Pygments",
    "types-PyYAML",
    "pypdf>=6.17.0",
    "smartypants==2.*",
    "typogrify==2.*",
    "xxhash",
]

[tool.doit]
dodoFile = "ssg/dodo.py"
cwdPath = "."

[tool.uv]
exclude-newer = "4 days"
package = false

[tool.uv.sources]
pygments = { git = "https://github.com/vincentbernat/pygments", branch = "feature/css-updates" }
pygments-haproxy = { git = "https://github.com/vincentbernat/pygments-haproxy", rev = "master" }
pygments-ios = { git = "https://github.com/vincentbernat/pygments-ios", rev = "master" }
pygments-junos = { git = "https://github.com/vincentbernat/pygments-junos", rev = "master" }

[tool.ruff.lint]
# Cached objects live as long as the process
ignore = ["B019"]

[tool.ruff.lint.per-file-ignores]
# Pygments lexers declare their tokens as class attributes
"ssg/lexers.py" = ["RUF012"]

[tool.mypy]
files = ["ssg"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Libraries without type information
[[tool.mypy.overrides]]
module = [
    "doit.*",
    "skia",
    "smartypants",
    "typogrify.*",
]
ignore_missing_imports = true
